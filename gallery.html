<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Page title shown in browser tab -->
<title>Gallery | Tobidoki</title>

<!-- Main stylesheet for layout, colors, and animations -->
<link rel="stylesheet" href="css/style.css">

<!-- JavaScript handles scroll reveal + animations -->
<script defer src="js/script.js"></script>
</head>

<!-- Body class allows page-specific styling -->
<body class="gallery-page">

<!-- ========================= -->
<!-- 💚 HEADER / NAVIGATION -->
<!-- ========================= -->
<header>
<h1>Tobidoki</h1>

<!-- Navigation links connect all pages -->
<nav>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="gallery.html">Gallery</a>
<a href="media.html">Media</a>
<a href="contact.html">Contact</a>
</nav>
</header>

<main>

<!-- ========================= -->
<!-- 🌸 GALLERY SECTION -->
<!-- ========================= -->
<!-- Displays a collection of images in a grid layout -->
<section class="gallery-section">

<!-- Title uses load-in animation for visual entry effect -->
<h2 class="gallery-title load-in">My Memories ♡</h2>

<!-- Grid container organizes items using CSS Grid -->
<div class="gallery-grid">

<!-- ========================= -->
<!-- 🧸 ORIGINAL IMAGES -->
<!-- ========================= -->

<!-- Each figure represents one gallery item -->
<!-- tabindex="0" allows keyboard users to focus the item for accessibility -->
<figure class="gallery-item reveal" tabindex="0">

  <!-- Image with descriptive alt text for accessibility -->
  <!-- loading="lazy" improves performance by loading images only when needed -->
  <img src="gallery/plush-collection.jpg" alt="A collection of character plush toys displayed together" loading="lazy">

  <!-- Caption gives context and adds personality -->
  <figcaption>Character Plush Collection ✧</figcaption>
</figure>

<figure class="gallery-item reveal" tabindex="0">
  <img src="gallery/stella-story.jpg" alt="Sketch of a character named Stella in a story concept" loading="lazy">
  <figcaption>Stella Story Sketch ♡</figcaption>
</figure>

<figure class="gallery-item reveal" tabindex="0">
  <img src="gallery/keychains.jpg" alt="Handmade character keychains arranged together" loading="lazy">
  <figcaption>Keychain Series ✿</figcaption>
</figure>

<figure class="gallery-item reveal" tabindex="0">
  <img src="gallery/group-figures.png" alt="Small character figures in a cozy display" loading="lazy">
  <figcaption>Cozy Character World ☁</figcaption>
</figure>

<!-- ========================= -->
<!-- ✨ NEW IMAGES -->
<!-- ========================= -->

<figure class="gallery-item reveal" tabindex="0">
  <img src="gallery/album-overview.jpg" alt="Full album overview showing photobook, CD, stickers, and inclusions arranged together" loading="lazy">
  <figcaption>Album Overview Layout ☁</figcaption>
</figure>

<figure class="gallery-item reveal" tabindex="0">
  <img src="gallery/blue-album.jpg" alt="Blue themed album set with photobook and photocards displayed" loading="lazy">
  <figcaption>Blue Album Dreams ♡</figcaption>
</figure>

<figure class="gallery-item reveal" tabindex="0">
  <img src="gallery/sticker-collection.jpg" alt="Pastel character sticker designs with cute illustrations" loading="lazy">
  <figcaption>Sticker Cutie Collection ✿</figcaption>
</figure>

<figure class="gallery-item reveal" tabindex="0">
  <img src="gallery/photobook-version.jpg" alt="Photobook version showing album packaging and printed contents" loading="lazy">
  <figcaption>Photobook Magic ☁</figcaption>
</figure>

<!-- ========================= -->
<!-- 💙 FINAL FEATURE IMAGE -->
<!-- ========================= -->

<!-- This final image highlights a styled collage -->
<figure class="gallery-item reveal" tabindex="0">
  <img src="gallery/gallerykpop-collage.jpg" alt="K-pop collage featuring blue aesthetic visuals, album imagery, and stylized edits" loading="lazy">
  <figcaption>Blue K-pop Collage ✧</figcaption>
</figure>

</div>

</section>

</main>

<!-- ========================= -->
<!-- 📝 FOOTER -->
<!-- ========================= -->
<footer>
<p>© 2026 Allison Consuegra • ITD 210</p>
</footer>

</body>
</html>
